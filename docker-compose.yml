# Uso:
#   docker compose up --build            → producción en http://localhost:3000
#   docker compose --profile dev up      → dev con hot reload en http://localhost:3001
#
# La configuración de Entra ID y del endpoint de Fabric se lee del archivo .env
# (ver .env.example). Son variables NEXT_PUBLIC_*, así que Next las inlina en el
# build: van como build args y cambiarlas exige `docker compose up --build`.
# Si no están, la app arranca igual en modo demostración: lib/data.ts cae al
# respaldo seed y las páginas pintan <BannerOffline />.

services:
  app:
    build:
      context: .
      target: runner
      args:
        NEXT_PUBLIC_ENTRA_CLIENT_ID: ${NEXT_PUBLIC_ENTRA_CLIENT_ID:-}
        NEXT_PUBLIC_ENTRA_TENANT_ID: ${NEXT_PUBLIC_ENTRA_TENANT_ID:-}
        NEXT_PUBLIC_ENTRA_REDIRECT_URI: ${NEXT_PUBLIC_ENTRA_REDIRECT_URI:-}
        NEXT_PUBLIC_FABRIC_GRAPHQL_ENDPOINT: ${NEXT_PUBLIC_FABRIC_GRAPHQL_ENDPOINT:-}
    image: cedis-ctrl-react:latest
    container_name: cedis-ctrl
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    # Sin `environment`: ya no hay secreto de servidor. El token es del usuario
    # y lo obtiene el navegador con MSAL; el resto se inlinó en el build.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/icon.svg').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  # Servidor de desarrollo: monta el código y usa las node_modules del contenedor.
  dev:
    profiles: ["dev"]
    build:
      context: .
      target: deps
    image: cedis-ctrl-react:dev
    container_name: cedis-ctrl-dev
    command: pnpm dev --port 3000 --hostname 0.0.0.0
    ports:
      - "${DEV_PORT:-3001}:3000"
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      WATCHPACK_POLLING: "true" # el bind mount desde Windows no emite eventos inotify
      # `next dev` sí las lee en runtime: aquí no hacen falta build args.
      NEXT_PUBLIC_ENTRA_CLIENT_ID: ${NEXT_PUBLIC_ENTRA_CLIENT_ID:-}
      NEXT_PUBLIC_ENTRA_TENANT_ID: ${NEXT_PUBLIC_ENTRA_TENANT_ID:-}
      NEXT_PUBLIC_ENTRA_REDIRECT_URI: ${NEXT_PUBLIC_ENTRA_REDIRECT_URI:-}
      NEXT_PUBLIC_FABRIC_GRAPHQL_ENDPOINT: ${NEXT_PUBLIC_FABRIC_GRAPHQL_ENDPOINT:-}
    volumes:
      - .:/app
      # Volúmenes anónimos: protegen las node_modules instaladas en la imagen
      # y el caché de build de que el bind mount del host los tape.
      - /app/node_modules
      - /app/.next
